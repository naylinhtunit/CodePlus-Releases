name: Build CodePlus desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            args: --target aarch64-apple-darwin --bundles app,dmg
            artifact: CodePlus-macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            args: --target x86_64-apple-darwin --bundles app,dmg
            artifact: CodePlus-macos-x64
          - name: Windows x64
            os: windows-latest
            args: --bundles msi,nsis
            artifact: CodePlus-windows-x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install and validate desktop source
        run: |
          npm ci
          npm test
      - name: Validate requested version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const version = process.env.RELEASE_VERSION;
            const pkg = JSON.parse(fs.readFileSync("package.json"));
            const app = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json"));
            if (!/^\d+\.\d+\.\d+$/.test(version) || pkg.version !== version || app.version !== version) throw new Error("Release/source version mismatch");
          '
      - name: Build signed desktop update
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing updater signing key"; exit 1; }
          npm run desktop:build -- ${{ matrix.args }}
      - name: Verify macOS application signatures
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find src-tauri/target -path '*/release/bundle/macos/CodePlus.app' -print -quit)"
          archive_path="$(find src-tauri/target -path '*/release/bundle/macos/CodePlus.app.tar.gz' -print -quit)"
          test -n "$app_path" && test -n "$archive_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          test -f "$app_path/Contents/_CodeSignature/CodeResources"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.sig
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
          if-no-files-found: error

  release:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Verify and normalize release assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/prepare-release-assets.mjs
          node scripts/create-updater-manifest.mjs "$RELEASE_VERSION" release-assets "$GITHUB_REPOSITORY"
      - name: Publish release and updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
            gh release edit "$tag" --draft=false --latest
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "CodePlus $tag" --notes "CodePlus $tag desktop release for macOS and Windows, including signed in-app updates." release-assets/*
            gh release edit "$tag" --latest
          fi
