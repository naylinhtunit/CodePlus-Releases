name: Build public desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v (must match public source)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            args: --target aarch64-apple-darwin --bundles app,dmg
            artifact: CodePlus-macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            args: --target x86_64-apple-darwin --bundles app,dmg
            artifact: CodePlus-macos-x64
          - name: Windows x64
            os: windows-latest
            args: --bundles msi,nsis
            artifact: CodePlus-windows-x64
    steps:
      - name: Check out public release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Validate version and updater configuration
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const version = process.env.RELEASE_VERSION;
            const pkg = JSON.parse(fs.readFileSync("package.json"));
            const app = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json"));
            if (!/^\d+\.\d+\.\d+$/.test(version) || pkg.version !== version || app.version !== version) throw new Error("Release/source version mismatch");
            if (app.bundle.createUpdaterArtifacts !== true || !app.plugins.updater.pubkey) throw new Error("Signed updater artifacts must be enabled");
          '
      - run: npm ci
      - run: npm test
      - name: Build signed desktop updates
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing original updater signing key"; exit 1; }
          npm run desktop:build -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.sig
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
          if-no-files-found: error

  release:
    name: Publish signed app and source in CodePlus-Releases
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Verify signatures and prepare complete release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-release-assets.mjs
          node scripts/create-updater-manifest.mjs "$RELEASE_VERSION"
          git archive --format=zip --prefix="CodePlus-$RELEASE_VERSION/" --output="release-assets/CodePlus-$RELEASE_VERSION-source.zip" HEAD
      - name: Publish only after every asset is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            test "$is_draft" = true || { echo "Published versions are immutable; increment the version."; exit 1; }
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "CodePlus $tag" --notes "CodePlus $tag: signed in-app updates for macOS and Windows, desktop installers, and matching application source. Click the update icon to download, install, and restart."
          fi
          gh release upload "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
